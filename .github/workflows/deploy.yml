name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: deploy-focuskeep
  cancel-in-progress: false   # never interrupt a build mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The server pins this key to a forced command (deploy.sh), so the
          # line below is ignored — the server always runs the deploy script.
          # A build on this small box can take a few minutes.
          command_timeout: 20m
          script: "echo triggering deploy"
